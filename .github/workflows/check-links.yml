name: Check Links Periodically

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 00 1 * *"

jobs:
  linkChecker:
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: "--config .lychee.toml --root-dir . --fallback-extensions md --no-progress docs/ blog/ src/ README.md"
          fail: false

      - name: Find existing report issue
        id: find-issue
        if: steps.lychee.outputs.exit_code != 0
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'report,automated issue',
            });
            const existing = issues.find(i => i.title === 'Link Checker Report');
            core.setOutput('number', existing ? existing.number : '');

      - name: Create or update issue from file
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
          issue-number: ${{ steps.find-issue.outputs.number }}
